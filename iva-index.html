<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ignite Vitality Alliance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;600&family=Arimo:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0cc0df;
    --teal-mid: #0495af;
    --teal-dark: #00687a;
    --white: #ffffff;
    --pale-yellow: #fffe99;
    --text-dark: #00687a;
    --text-black: #000000;
    --accent-red: #cc0000;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background-color: var(--bg);
    font-family: 'Open Sans', Arial, sans-serif;
    color: var(--text-black);
    min-height: 100vh;
  }

  h1, h2, h3 {
    font-family: 'Poppins', sans-serif;
  }

  a { text-decoration: none; }

  /* ---------- Navigation ---------- */
  .navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: var(--teal-dark);
    padding: 0.75rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  }

  .nav-brand {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    color: var(--white);
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }

  .nav-links {
    list-style: none;
    display: flex;
    gap: 1.75rem;
    font-family: 'Arimo', sans-serif;
  }

  .nav-links a {
    color: var(--white);
    font-weight: 500;
    font-size: 0.95rem;
    padding: 0.4rem 0.1rem;
    border-bottom: 2px solid transparent;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .nav-links a:hover,
  .nav-links a:focus-visible {
    border-color: var(--pale-yellow);
    color: var(--pale-yellow);
  }

  .nav-toggle {
    display: none;
    flex-direction: column;
    justify-content: space-between;
    width: 26px;
    height: 20px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .nav-toggle span {
    display: block;
    height: 3px;
    width: 100%;
    background-color: var(--white);
    border-radius: 2px;
  }

  /* ---------- Hero ---------- */
  .hero {
    display: flex;
    min-height: calc(100vh - 60px);
  }

  .hero-image {
    flex: 1 1 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--teal-dark);
    padding: 2rem;
  }

  .hero-image img {
    max-width: 100%;
    max-height: 70vh;
    width: auto;
    height: auto;
    object-fit: contain;
  }

  .hero-content {
    flex: 1 1 50%;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 3rem 4rem;
    background-color: var(--bg);
  }

  .hero-content h1 {
    color: var(--white);
    font-size: clamp(1.8rem, 3vw, 2.6rem);
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 0.75rem;
  }

  .hero-content p {
    color: var(--white);
    font-size: 1.05rem;
    margin-bottom: 2rem;
    max-width: 32rem;
  }

  .action-buttons {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    width: 100%;
    max-width: 22rem;
  }

  .btn {
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    text-align: center;
    padding: 1rem 1.5rem;
    border-radius: 8px;
    border: 2px solid var(--white);
    color: var(--white);
    background-color: var(--teal-mid);
    transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }

  .btn:hover,
  .btn:focus-visible {
    background-color: var(--pale-yellow);
    color: var(--teal-dark);
    border-color: var(--pale-yellow);
    transform: translateY(-2px);
  }

  .btn-secondary {
    background-color: transparent;
  }

  .btn-secondary:hover,
  .btn-secondary:focus-visible {
    background-color: var(--white);
    color: var(--teal-dark);
    border-color: var(--white);
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .hero-content { padding: 2.5rem 2rem; }
  }

  @media (max-width: 768px) {
    .nav-links {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      flex-direction: column;
      background-color: var(--teal-dark);
      gap: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease;
    }

    .nav-links.open {
      max-height: 20rem;
    }

    .nav-links a {
      display: block;
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .nav-toggle { display: flex; }

    .hero {
      flex-direction: column;
      min-height: auto;
    }

    .hero-image {
      padding: 2rem 1.5rem 1rem;
    }

    .hero-image img {
      max-height: 40vh;
    }

    .hero-content {
      padding: 1.5rem 1.5rem 3rem;
      align-items: center;
      text-align: center;
    }

    .hero-content p { max-width: 100%; }

    .action-buttons { max-width: 100%; }
  }

  @media (max-width: 480px) {
    .nav-brand { font-size: 1rem; }
    .hero-content h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <span class="nav-brand">Ignite Vitality Alliance</span>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navLinks">
    <span></span><span></span><span></span>
  </button>
  <ul class="nav-links" id="navLinks">
    <li><a href="#home">Home</a></li>
    <li><a href="#personal">Personal</a></li>
    <li><a href="#business">Business</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<section class="hero" id="home">
  <div class="hero-image">
    <img src="IVA Logo.png" alt="Ignite Vitality Alliance logo">
  </div>
  <div class="hero-content">
    <h1>Igniting Vitality, Together.</h1>
    <p>Wellness solutions for individuals and organizations ready to thrive.</p>
    <div class="action-buttons">
      <a href="#personal" class="btn">Personal Health and Wellness</a>
      <a href="#business" class="btn btn-secondary">Especially for Businesses</a>
    </div>
  </div>
</section>

<script>
  const navToggle = document.getElementById('navToggle');
  const navLinks = document.getElementById('navLinks');

  navToggle.addEventListener('click', () => {
    const isOpen = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', isOpen);
  });

  navLinks.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      navLinks.classList.remove('open');
      navToggle.setAttribute('aria-expanded', 'false');
    });
  });
</script>

</body>
</html>
